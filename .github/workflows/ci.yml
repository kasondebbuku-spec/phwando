name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phwando
          POSTGRES_PASSWORD: phwando
          POSTGRES_DB: phwando_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phwando"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://phwando:phwando@localhost:5432/phwando_test?schema=public
      TEST_DATABASE_URL: postgresql://phwando:phwando@localhost:5432/phwando_test?schema=public
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters
      LENCO_MOCK: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
