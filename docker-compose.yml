# Local PostgreSQL for development and tests:  docker compose up -d
# Creates two databases: phwando (dev) and phwando_test (used by `npm test`).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: phwando
      POSTGRES_PASSWORD: phwando
      POSTGRES_DB: phwando
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phwando"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
